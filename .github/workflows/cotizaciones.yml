name: Actualizar cotizaciones
# Horas en UTC. Madrid = UTC+2 en verano (CEST) / UTC+1 en invierno (CET).
# Cierre del mercado continuo: 17:35 CEST = 15:35 UTC (16:35 UTC en invierno).
#
#   "7 18 * * 1-5"  -> 20:07 CEST, mismo dia. Da precio del dia a la app, pero
#                      PROVISIONAL: Yahoo puede no haber consolidado la subasta de cierre.
#   "35 20 * * 1-5" -> 22:35 CEST. Primer intento de consolidacion.
#   "22 22 * * 1-5" -> 00:22 CEST. Segundo intento.
#   "40 5 * * 2-6"  -> 07:40 CEST del dia siguiente, ANTES de la apertura de Madrid (09:00).
#                      PASE DE CONFIRMACION T+1: es el que fija el cierre definitivo.
#                      Martes a sabado, para cubrir tambien la sesion del viernes.
#
# Con la ventana movil del script, cada pase RECONSULTA los ultimos 10 dias y
# sobrescribe los cierres que Yahoo haya consolidado con otro valor. Antes del parche
# los pases 2 y 3 no pedian nada ("ya al dia") y el primer valor quedaba congelado.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "7 18 * * 1-5"
    - cron: "35 20 * * 1-5"
    - cron: "22 22 * * 1-5"
    - cron: "40 5 * * 2-6"
permissions: { contents: write }
# [17-ago-2026] Mismo grupo que agenda/vigia/fundamentales. El nombre es historico
# ("buzon-commit") pero lo que serializa es lo unico que importa aqui: que dos Actions
# no empujen a `main` a la vez. Este workflow se habia quedado fuera del grupo.
concurrency:
  group: buzon-commit
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # [17-ago-2026] Con `pip install yfinance` a secas, el dia que sus autores publiquen
      # una version mayor los cuatro pases diarios se caen sin que aqui se haya tocado nada.
      # El tope solo frena el salto de major, que es el unico que rompe la API de verdad.
      - run: pip install "yfinance<2"
      - run: python actualizar_cotizaciones.py
      # [17-ago-2026] EL PUSH TIENE QUE SOBREVIVIR A UNA COLISION.
      # El 17-ago el pase de las 22:35 murio con «! [rejected] main -> main (fetch first)»:
      # el trabajo dura unos dos minutos y medio, y en esa ventana entro en `main` una
      # publicacion hecha a mano desde el PC. El dato del dia estaba bien descargado y se
      # perdio en el ultimo metro, solo por no reintentar. Ojo: el `concurrency` de arriba
      # NO cubre este caso —el buzon publica desde fuera de Actions, no hay grupo que lo
      # serialice—, asi que el reintento es la proteccion de verdad y el grupo es el extra.
      # Mismo bucle que agenda.yml y fundamentales.yml, que ya lo llevaban.
      - name: Commit y push (con reintentos ante colisiones)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add precios
          if git diff --staged --quiet; then
            echo "Sin cambios en precios"; exit 0
          fi
          git commit -m "Cotizaciones"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Push OK en el intento $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push rechazado, reintento $i..."; sleep 5
          done
          echo "No se pudo hacer push tras 5 intentos"; exit 1
