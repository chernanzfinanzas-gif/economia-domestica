name: Intradia (cartera)
# Precio de la sesion en curso para las empresas con dossier -> intradia.json (raiz).
# NO toca precios/*.json: eso es el historico de cierres y lo lleva cotizaciones.yml.
#
# Horas en UTC. El cron de GitHub no entiende de horario de verano, asi que aqui se
# abre una ventana AMPLIA (06:00-16:59 UTC = 08:00-18:59 CEST / 07:00-17:59 CET) y es
# el script el que decide si el continuo espanol esta abierto (09:00-17:45 de Madrid).
# Los pases que caen fuera salen en dos segundos sin pedir nada a Yahoo.
#
# Y un aviso para el yo del futuro: el cron de la capa gratuita NO es puntual. Se
# retrasa entre 5 y 15 minutos con frecuencia y de vez en cuando se salta un pase.
# Sumado a los 15 de retraso de Yahoo, el dato de la app tiene entre 15 y 40 minutos.
# Es lo que hay sin pagar el dato en tiempo real a BME, y para seguir la cartera sobra.
on:
  workflow_dispatch: {}
  schedule:
    # Nada de minutos redondos: el :00 es el minuto mas congestionado de GitHub y es
    # donde mas pases se caen. Mismo ritmo de 20 min, corrido a un hueco tranquilo.
    - cron: "6,26,46 6-16 * * 1-5"
permissions: { contents: write }

# Si un pase se solapa con el anterior (Yahoo lento), se cancela el viejo: mas vale
# perder un pase que dejar dos commits peleandose por el mismo fichero.
concurrency:
  group: intradia
  cancel-in-progress: true

jobs:
  intradia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Instalar dependencias
        # tzdata NO es opcional: sin ella ZoneInfo('Europe/Madrid') falla, el script lee
        # la hora del runner (UTC) y la guardia horaria da 'mercado cerrado' toda la manana.
        run: pip install --quiet yfinance tzdata
      - name: Actualizar intradia.json
        run: python actualizar_intradia.py --salida intradia.json
        # En el REPO el script vive en la raíz, igual que actualizar_cotizaciones.py.
        # La carpeta "Cotizaciones (para GitHub)" es la copia de trabajo local.
      - name: Publicar intradia.json en la rama `datos`
        run: |
          test -f intradia.json || { echo "No se ha escrito nada: nada que publicar."; exit 0; }
          # POR QUE UNA RAMA APARTE (06-ago-2026):
          # Cuando esto commiteaba en `main`, CADA pase disparaba un despliegue completo de
          # GitHub Pages (entre 1 y 6 minutos), y hasta que ese despliegue terminaba la app
          # seguia sirviendo el intradia ANTERIOR. Al retraso de 15 min de la fuente y al del
          # cron se le sumaba el del despliegue: el dato "vivo" llegaba con media hora encima.
          # Y de paso se comia el presupuesto de ~10 construcciones/hora de Pages, que es
          # compartido con las publicaciones de la app.
          # Pages solo construye desde `main`, asi que escribiendo en `datos` no se entera.
          # La app lee el fichero de raw.githubusercontent.com, que sirve el commit en segundos
          # sin construir nada.
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp intradia.json "$RUNNER_TEMP/intradia.json"
          # Clon aparte y minimo: asi no se toca el arbol de `main` que hay en el runner y no
          # hay forma de arrastrar por accidente un fichero de la app a la rama de datos.
          mkdir -p "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 origin datos 2>/dev/null; then
            git checkout -q -b datos FETCH_HEAD
          else
            echo "La rama datos no existe todavia: se crea ahora."
            git checkout -q -b datos
          fi
          cp "$RUNNER_TEMP/intradia.json" intradia.json
          git add intradia.json
          if git diff --cached --quiet; then
            echo "Sin cambios: no hay commit."
            exit 0
          fi
          git commit -q -m "Intradia: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Nadie mas escribe en `datos`, asi que no hay carrera que rebasar.
          for i in 1 2 3; do
            git push -q origin datos && { echo "Publicado en datos."; exit 0; }
            sleep 5
          done
          echo "No he podido publicar tras 3 intentos."
          exit 1
