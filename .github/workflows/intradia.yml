name: Intradia (cartera)
# ============================================================================
# PASE HORARIO CON BUCLE INTERNO — 06-ago-2026
#
# POR QUE ESTO Y NO UN CRON CADA 20 MINUTOS
# Con cron "0,20,40 6-16 * * 1-5" (33 pases al dia), GitHub entrego UNO en toda
# la manana del 06-ago-2026. Cinco ejecuciones en total y solo una programada;
# las otras cuatro a mano. El script no fallaba: las cinco en verde en ~50 s.
# Lo que no llegaba era el evento. Se probo a correr los minutos a "6,26,46"
# —el :00 es el minuto mas congestionado de GitHub— y de las cuatro siguientes
# oportunidades no entrego NINGUNA. En repos publicos de la capa gratuita los
# cron frecuentes se descartan, y no hay minuto listo que lo arregle.
#
# LA IDEA
# Dejar de pedirle a GitHub 33 favores al dia y pedirle 11. Un unico disparo
# por hora —eso si lo cumple— y dentro del trabajo un bucle que hace una
# pasada cada 5 minutos durante ~52. Cuando el bucle se agota ya ha entrado el
# disparo de la hora siguiente y el `concurrency` corta el viejo: el relevo es
# parte del diseno, no un accidente.
#
# LO QUE CUESTA
# Un runner ocupado casi todo el horario de mercado. En repositorios PUBLICOS
# los minutos de Actions son gratis e ilimitados, asi que el coste es cero.
# Si algun dia el repo pasara a privado, esto se come la cuota en dos dias:
# volver entonces al cron corto. Es la unica condicion que invalida el diseno.
#
# LO QUE SE GANA, ADEMAS DE FIABILIDAD
# El dato pasa de 20 a 5 minutos de ritmo. Sumado a los 15 de retraso de la
# fuente, la app pasa de ensenar precios de hace 15-40 min a 15-20 min.
# ============================================================================
on:
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos de cobertura (una pasada cada 5). 300 = 5 horas."
        required: false
        default: "300"

# ── SIN `schedule`, Y ES DELIBERADO (07-ago-2026) ────────────────────────────
# Medido el 7-ago con GitHub funcionando con normalidad: de los ticks de las 09:03,
# 10:03 y 11:03 solo entro uno, y con 16 minutos de retraso. El 6-ago, con el servicio
# degradado, entrego 2 de unas 30 y una llego con dos horas de retraso.
#
# Un cron que entrega un tercio no es un reloj, es una loteria. Y con ejecuciones
# largas era ademas ACTIVAMENTE DANINO: cualquier tick que entrase cancelaria las
# cinco horas de cobertura para sustituirlas por 52 minutos.
#
# El reloj pasa al movil, que si cumple los horarios: un atajo lo dispara a las 09:00
# y el operador pulsa el boton entre las 13:00 y las 14:00. Dos ejecuciones de 300
# minutos cubren la sesion entera, y la segunda cancela a la primera sin dejar hueco.
permissions: { contents: write }

concurrency:
  group: intradia
  cancel-in-progress: true

jobs:
  intradia:
    runs-on: ubuntu-latest
    # El tope duro de GitHub son 360 minutos por trabajo. Se deja margen para el
    # checkout, el pip install y la ultima pasada: el bucle se limita a 330.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Instalar dependencias
        # tzdata NO es opcional: sin ella ZoneInfo('Europe/Madrid') falla, el
        # script lee la hora del runner (UTC) y la guardia horaria da "mercado
        # cerrado" toda la manana. Nos costo una manana entera el 06-ago-2026.
        run: pip install --quiet yfinance tzdata

      - name: Preparar el clon de la rama `datos`
        # Se clona UNA vez, fuera del bucle. Dentro solo se copia y se empuja.
        #
        # POR QUE UNA RAMA APARTE: cuando esto commiteaba en `main`, cada pase
        # disparaba un despliegue completo de Pages (1-6 min) y hasta que
        # terminaba la app seguia sirviendo el intradia ANTERIOR. Ademas se
        # comia el presupuesto de ~10 construcciones/hora, compartido con las
        # publicaciones de la app. Pages solo construye desde `main`.
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 origin datos 2>/dev/null; then
            git checkout -q -b datos FETCH_HEAD
          else
            echo "La rama datos no existe todavia: se crea ahora."
            git checkout -q -b datos
          fi

      - name: Pasadas cada 5 minutos durante el tiempo pedido
        env:
          # Por `env` y NO interpolado en el shell: lo que llega de fuera no se mete
          # nunca directamente en una linea de comandos.
          MINUTOS: ${{ inputs.minutos }}
        # ¡OJO CON `set -e`! GitHub ejecuta los `run:` con `bash -e`, asi que
        # CUALQUIER orden que devuelva distinto de cero mata el paso entero.
        # Eso incluye un `[ prueba ] && accion` cuya prueba salga falsa, que es
        # como estaba escrito este bucle en el primer borrador: la comprobacion
        # "¿ya es la hora de parar?" daba falsa en la primera vuelta, devolvia
        # 1, y el paso moria tras UNA sola pasada... marcandose como fallido.
        # Por eso aqui todo condicional va con `if`, que si esta a salvo de -e.
        run: |
          set -u
          INTERVALO=300
          MIN="${MINUTOS:-300}"
          case "$MIN" in ''|*[!0-9]*) MIN=300 ;; esac      # basura -> valor por defecto
          [ "$MIN" -lt 5 ]   && MIN=5
          [ "$MIN" -gt 330 ] && MIN=330                    # tope de GitHub: 360 por trabajo
          echo "Cobertura pedida: $MIN minutos (una pasada cada $((INTERVALO/60)))."
          FIN=$(( $(date +%s) + MIN*60 ))
          n=0; escritos=0; mudos=0
          while : ; do
            n=$(( n + 1 ))
            echo "::group::Pasada $n  ($(date -u '+%H:%M:%S') UTC)"
            rc=0
            # [14-ago-2026] --series apunta DIRECTAMENTE al clon de la rama `datos`.
            # Tiene que ser ahi y no en el area de trabajo: el script fusiona lo nuevo
            # con lo ya guardado, y lo guardado esta en esa rama. Escribirlo aparte y
            # copiarlo despues perderia el historico en cada pasada.
            python actualizar_intradia.py --salida intradia.json --series "$RUNNER_TEMP/pub/series" || rc=$?
            if [ "$rc" -eq 0 ] && [ -f intradia.json ]; then
              cp intradia.json "$RUNNER_TEMP/pub/intradia.json"
              (
                cd "$RUNNER_TEMP/pub"
                git add intradia.json
                # La carpeta puede no existir todavia (primera vez, o una pasada en la
                # que aun no tocaba escribir la serie). Con `if`, que `bash -e` mata el
                # paso entero ante cualquier orden que devuelva distinto de cero.
                if [ -d series ]; then git add series; fi
                if git diff --cached --quiet; then
                  echo "Sin cambios: no hay commit."
                else
                  git commit -q -m "Intradia: $(date -u '+%Y-%m-%d %H:%M UTC')"
                  # Nadie mas escribe en `datos`, pero si el push choca se
                  # rehace la rama sobre lo que haya y se reintenta.
                  for i in 1 2 3; do
                    if git push -q origin datos; then
                      echo "Publicado en datos."
                      break
                    fi
                    echo "Push rechazado (intento $i): rehago sobre origin/datos."
                    if git fetch -q --depth=1 origin datos; then
                      git reset -q --soft FETCH_HEAD
                    fi
                    sleep 5
                  done
                fi
              )
              escritos=$(( escritos + 1 ))
            elif [ "$rc" -eq 1 ]; then
              # El script solo devuelve 1 cuando el mercado estaba ABIERTO y no
              # trajo un solo precio. Es el fallo mudo que nos tuvo ciegos.
              echo "::warning::Pasada $n: mercado abierto y ni un precio."
              mudos=$(( mudos + 1 ))
            fi
            echo "::endgroup::"
            if [ "$(date +%s)" -ge "$FIN" ]; then
              break
            fi
            sleep "$INTERVALO"
          done
          echo "Resumen: $n pasadas en $MIN min, $escritos con datos, $mudos mudas."
          # Que la hora entera se haya ido en blanco con el mercado abierto no
          # puede salir en verde: es exactamente lo que no vimos venir.
          if [ "$escritos" -eq 0 ] && [ "$mudos" -gt 0 ]; then
            echo "::error::Una hora entera sin traer un solo precio."
            exit 1
          fi
