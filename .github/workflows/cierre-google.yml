name: Cierre desde Google
# ============================================================================
#  Publica `cierre-google.json` en la rama `datos` con el cierre de la subasta
#  que la hoja «Cierres KH» captura por su cuenta, y SIEMBRA ese cierre en el
#  historico `precios/*.json` de `main` como barra PROVISIONAL.  [20-ago-2026]
#
#  POR QUE NO BASTA CON YAHOO
#  El pase de las 20:07 es PROVISIONAL y el cierre definitivo no queda fijado
#  hasta el T+1 de las 07:40 del dia siguiente. Google tiene la subasta a las
#  17:36. Medido el 20-ago sobre las 102 del universo: el cierre de Google es
#  el mismo numero que el de Yahoo, redondeado a 2 decimales, en 101 de 102.
#
#  [01-sep-2026] ESA MEDICION NO SE REPRODUCE SIEMPRE, y conviene saberlo antes
#  de fiarse. El 31-ago, sobre las 25 empresas presentes a la vez en
#  `cierre-google.json` y en `intradia.json`: mediana de diferencia 0,205%,
#  maximo 2,33% (CIE 25,10 contra 25,70) y ONCE de 25 por encima del 0,25%. Por
#  eso la siembra entra como PROVISIONAL y no como cierre definitivo: quien
#  confirma sigue siendo el T+1 de Yahoo, y cada discrepancia queda registrada
#  en `precios/_siembra.json` para poder decidir con datos y no con impresiones.
#
#  HORAS (en UTC; Madrid es UTC+2 en verano y UTC+1 en invierno)
#    "50 16 * * 1-5" -> 18:50 CEST. La buena en VERANO.
#    "50 17 * * 1-5" -> 18:50 CET.  La buena en INVIERNO.
#    "20 18 * * 1-5" -> 20:20 CEST / 19:20 CET. PASE DE RED, ver abajo.
#  Se lanzan las dos primeras todo el año a proposito: la que cae fuera de hora no
#  encuentra el bloque de control y publica lo mismo, o no publica nada. Es mas
#  barato que un cron que hay que acordarse de cambiar dos veces al año --y que
#  el dia que se olvide fallara en silencio.
#
#  EL PASE DE RED, Y POR QUE HACE FALTA               [27-ago-2026]
#  Los `schedule` de GitHub son de MEJOR ESFUERZO: se retrasan --y se tiran-- cuando
#  la cola va cargada. No es teoria, esta medido en el historico de commits de la
#  rama `datos`: los pases de las 16:50/17:50 aterrizan siempre entre 25 y 52 minutos
#  tarde (17:15-17:42 y 18:13-18:28 UTC del 20 al 26-ago). Y el 27-ago se cayeron los
#  DOS: cero commits ese dia hasta que Carlos lo lanzo a mano a las 21:02.
#  Un tercer intento a las 18:20 UTC cubre ese caso y sigue estando muy por delante
#  del T+1 de Yahoo de las 07:40. No cuesta nada el dia que los otros funcionan: el
#  paso «Publicar» compara contra el indice y sale sin commit si no hay diferencia.
#  Lo que NO arregla es un dia en que GitHub tire los tres; para eso esta el reintento
#  de la app (26-excelprecios.js, `_googleTimer`), que repregunta cada 10 minutos.
#
#  POR QUE A LAS 18:50 Y NO A LAS 18:15
#  La hoja captura DOS veces: `cierre` a las 17:55-18:10 y `control` a las
#  18:30-18:45. A las 18:50 estan las dos, asi que el fichero sale con el precio
#  Y con la comparacion que dice si la hora temprana aguanta. Sigue siendo una
#  hora antes del primer pase de Yahoo.
#
#  QUE HACE AHORA CON `precios/*.json`, Y POR QUE CAMBIA               [01-sep-2026]
#  Hasta hoy aqui ponia «NO toca precios/*.json». Esa linea costo la sesion del
#  lunes 31-ago: el cierre se capturo bien a las 20:31, se publico bien en `datos`,
#  y el martes por la manana el historico seguia terminando el VIERNES 28, porque el
#  unico destino del fichero era el localStorage del navegador -- y solo si la app
#  estaba abierta entre las 18:40 y medianoche. El dato existia en el servidor y se
#  perdia por el camino. Encima el pase de Yahoo de esa noche corrio tres veces en
#  verde sin traer la sesion: 107 ficheros con +1 -1, solo la linea `actualizado`.
#  Ahora `sembrar_cierre.py` escribe la barra en el historico marcada PROVISIONAL,
#  sin avanzar `confirmadoHasta`, y NUNCA pisa una fecha que ya exista. Corregir y
#  confirmar sigue siendo competencia de `actualizar_cotizaciones.py`, que reconsulta
#  los ultimos 10 dias y sobrescribe via `fusionar()`.
#  `cierre_google.py` sigue sin tocar nada: quien siembra es el script nuevo.
# ============================================================================
on:
  schedule:
    - cron: "50 16 * * 1-5"
    - cron: "50 17 * * 1-5"
    - cron: "20 18 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

# Mismo grupo que cotizaciones/agenda/vigia/fundamentales: lo que serializa es lo
# unico que importa, que dos Actions no empujen a la vez.
concurrency:
  group: buzon-commit
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
        # Sin `pip install`: el script es de biblioteca estandar. Una dependencia
        # menos es un motivo menos de fallo a las siete de la tarde.

      - name: Preparar el clon de la rama `datos`
        run: |
          set -e
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf _datos && mkdir _datos && cd _datos
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 origin datos 2>/dev/null; then
            git checkout -q -b datos FETCH_HEAD
          else
            echo "La rama datos no existe todavia: se crea ahora."
            git checkout -q -b datos
          fi

      - name: Leer la hoja y escribir el fichero
        env:
          HOJA_GOOGLE_CSV: ${{ secrets.HOJA_GOOGLE_CSV }}
        run: |
          set -e
          if [ -z "$HOJA_GOOGLE_CSV" ]; then
            echo "::error::Falta el secreto HOJA_GOOGLE_CSV (la URL del CSV publicado de la hoja)."
            exit 1
          fi
          python cierre_google.py --tickers tickers.json --salida _datos/cierre-google.json

      - name: Publicar
        run: |
          set -e
          cd _datos
          # [20-ago-2026] `git add` PRIMERO, y la comparacion contra el INDICE.
          # La primera version preguntaba `git diff --quiet -- fichero` antes de anadirlo,
          # y `git diff` no ve los ficheros que todavia no estan en el repositorio: en la
          # PRIMERA ejecucion -la unica que crea el fichero- no encontraba diferencia
          # alguna, decidia que no habia nada que publicar y salia con exito. El Action
          # entero en verde y el fichero sin subir. Una guarda que se traga justo el caso
          # para el que existe es peor que no tenerla: no falla, miente.
          git add cierre-google.json
          if git diff --cached --quiet; then
            echo "Sin cambios: no publico."
            exit 0
          fi
          git commit -q -m "cierre-google: $(date -u +%Y-%m-%dT%H:%MZ)"
          # [copiado de intradia.yml, 17-ago] EL PUSH TIENE QUE SOBREVIVIR A UNA COLISION.
          # El dato puede estar bien bajado y perderse en el ultimo metro solo por no
          # reintentar: paso el 17-ago con el pase de las 22:35 de cotizaciones.
          for i in 1 2 3; do
            if git push -q origin datos; then echo "Publicado en datos."; exit 0; fi
            echo "Push rechazado (intento $i): rehago sobre origin/datos."
            git fetch -q --depth=1 origin datos && git reset -q --soft FETCH_HEAD || true
            git add cierre-google.json
            git commit -q -m "cierre-google: $(date -u +%Y-%m-%dT%H:%MZ)" || true
            sleep 5
          done
          echo "::error::No he podido publicar despues de 3 intentos."
          exit 1

      # ----------------------------------------------------------------------
      # LA SIEMBRA. Va DESPUES de publicar en `datos` a proposito: si algo falla
      # aqui, el fichero de Google ya esta a salvo en su rama y la app lo sigue
      # aplicando como siempre. La siembra es una mejora del historico, no una
      # condicion para que el cierre llegue.
      # ----------------------------------------------------------------------
      - name: Sembrar el cierre en el historico (provisional)
        run: |
          set -e
          if [ ! -f _datos/cierre-google.json ]; then
            echo "::warning::No hay cierre-google.json: no se siembra nada."
            exit 0
          fi
          # `--intradia` es opcional y aqui SI esta: es lo que alimenta la guarda de
          # coherencia, que compara el `cierreAnt` de Yahoo con la ultima barra del
          # historico. El 31-ago los dos ficheros del mismo repo se contradecian y
          # nada lo dijo; `_estado.json` publicaba `rezagados: []` con una sesion
          # entera ausente.
          INTRA=""
          [ -f _datos/intradia.json ] && INTRA="--intradia _datos/intradia.json"
          python sembrar_cierre.py --google _datos/cierre-google.json $INTRA --escribir

      - name: Publicar la siembra en main
        run: |
          set -e
          # Tres intentos, y cada uno REHACE la siembra sobre el `main` de ese momento
          # en vez de rebasar. Es mas barato y mas seguro: el script es idempotente
          # -- si la barra ya esta, no la pisa -- y deriva todo de los ficheros, asi
          # que recalcular sobre la punta nueva no puede dejar un estado a medias.
          INTRA=""
          [ -f _datos/intradia.json ] && INTRA="--intradia _datos/intradia.json"
          for i in 1 2 3; do
            git add precios
            if git diff --cached --quiet; then
              echo "Historico sin cambios: no publico."
              exit 0
            fi
            git commit -q -m "Siembra del cierre desde Google (provisional) · $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin HEAD:main; then
              echo "Siembra publicada en main."
              exit 0
            fi
            echo "Push rechazado (intento $i): rehago la siembra sobre origin/main."
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            python sembrar_cierre.py --google _datos/cierre-google.json $INTRA --escribir
            sleep 5
          done
          echo "::error::No he podido publicar la siembra despues de 3 intentos."
          exit 1
